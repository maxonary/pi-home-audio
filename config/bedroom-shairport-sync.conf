general = {
  name = "Bedroom";
  output_backend = "alsa";
  interpolation = "soxr";
};
alsa = {
  output_device = "plughw:CARD=Katana,DEV=0";
  ignore_device_missing = "yes";
};
diagnostics = {
  statistics = "yes";
  log_verbosity = 1;
};

metadata = {
 progress_interval = 1.0;
 enabled = "yes";
 include_cover_art = "yes";
 pipe_name = "/run/bedroom-now-playing/metadata";
};
