<!doctype html><html><head><meta charset="utf-8"><title>Bedroom · Now Playing</title><style>
*{box-sizing:border-box}body{margin:0;background:#17151b;color:white;font-family:-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',sans-serif;overflow:hidden}.back{position:fixed;inset:-15%;background:center/cover no-repeat;filter:blur(95px) saturate(.85);opacity:.48;transition:background-image 1.5s}body:after{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#0002,#0009);pointer-events:none}main{position:relative;z-index:1;height:100vh;padding:9vh 10vw;display:grid;grid-template-columns:min(44vw,72vh) 1fr;gap:7vw;align-items:center}.cover{aspect-ratio:1;background:linear-gradient(145deg,#e65b73,#8b294d);border-radius:2.2%;box-shadow:0 28px 65px #0005;display:grid;place-items:center;font-size:20vh;color:#ffffff99;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:13px;font-weight:600;letter-spacing:2.5px;color:#fff9;margin-bottom:32px}h1{font-size:clamp(28px,3.1vw,65px);line-height:1.12;letter-spacing:-1.5px;margin:0 0 12px;font-weight:700}.artist{font-size:clamp(22px,2.3vw,44px);color:#fff9;line-height:1.25}.album{font-size:18px;color:#fff6;margin-top:14px}.progress{margin-top:50px}.track{height:5px;border-radius:8px;background:#ffffff25;overflow:hidden}.fill{height:100%;background:#ffffffb0;width:0;transition:width 1s linear}.times{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#fff6;font-variant-numeric:tabular-nums}.status{margin-top:46px;display:flex;gap:10px;align-items:center;font-size:14px;color:#fff8}.bars{display:flex;align-items:center;gap:3px;height:18px}.bars i{width:3px;background:#fff9;border-radius:2px;height:5px}.playing .bars i{animation:pulse .85s ease-in-out infinite alternate}.bars i:nth-child(2){animation-delay:-.4s}.bars i:nth-child(3){animation-delay:-.7s}@keyframes pulse{to{height:17px}}@media(max-aspect-ratio:1/1){main{grid-template-columns:1fr;gap:4vh;padding:6vh 12vw}.cover{max-height:48vh;justify-self:center;width:48vh}.eyebrow{margin-bottom:16px}.progress{margin-top:24px}}
</style></head><body><div class="back" id="back"></div><main><div class="cover" id="cover">♫</div><section><div class="eyebrow">BEDROOM · AIRPLAY</div><h1 id="title">Bedroom</h1><div class="artist" id="artist">Ready for AirPlay</div><div class="album" id="album"></div><div class="progress" id="progress" hidden><div class="track"><div class="fill" id="fill"></div></div><div class="times"><span id="elapsed"></span><span id="remaining"></span></div></div><div class="status"><span class="bars"><i></i><i></i><i></i></span><span id="status">Waiting for music</span></div></section></main><script>
let lastArt=0,s=null,received=0;const el=id=>document.getElementById(id);function fmt(n){n=Math.max(0,Math.floor(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}async function update(){try{let r=await fetch('/state');s=await r.json();received=performance.now();for(let k of ['title','artist','album'])el(k).textContent=s[k];document.body.classList.toggle('playing',s.playing);el('status').textContent=s.playing?'Playing on Katana':'Ready for AirPlay';if(s.art&&s.art!==lastArt){lastArt=s.art;let url='/art?v='+lastArt;let img=new Image();img.onload=()=>{el('cover').replaceChildren(img);el('back').style.backgroundImage=`url("${url}")`};img.src=url}}catch(e){el('status').textContent='Reconnecting…'}}function tick(){if(!s)return;let t=Math.min(s.duration,s.elapsed+(s.playing?(performance.now()-received)/1000:0));el('progress').hidden=!(s.duration>0);el('fill').style.width=(s.duration?100*t/s.duration:0)+'%';el('elapsed').textContent=fmt(t);el('remaining').textContent='−'+fmt(s.duration-t)}setInterval(update,1000);setInterval(tick,500);update();
</script></body></html>
